# Render Blueprint — New → Blueprint → pick this repo. Fill the "sync: false" values in the dashboard.
services:
  - type: web
    name: famous-techx-pos-api
    runtime: node
    rootDir: server
    plan: starter            # free plans sleep when idle; tills need the API awake
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: APP_URL
        sync: false          # public address of the static site below
      - key: CORS_ORIGINS
        sync: false          # optional: extra origins, e.g. the site's onrender.com URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"         # Brevo SMTP relay (TLS)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: famous-techx-pos-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # https://famous-techx-pos-api.onrender.com
